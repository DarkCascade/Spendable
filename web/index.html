<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spendable</title>
  <meta name="description" content="How much can I actually spend right now? Recurring bills learned from your bank CSV exports. Everything stays on your phone.">
  <meta name="theme-color" content="#0E0A1F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spendable">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Open menu" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <h1 id="title" class="title shimmer">SPENDABLE</h1>
    <span class="icon-btn" aria-hidden="true"></span>
  </header>

  <div id="scrim" class="scrim" hidden></div>
  <nav id="drawer" class="drawer" aria-label="Menu" inert>
    <div class="drawer-head">
      <div class="drawer-title">SPENDABLE</div>
      <div id="drawerStats" class="muted small">0 transactions · 0 recurring</div>
    </div>
    <button class="drawer-item" data-action="import">📥&nbsp;&nbsp;Import bank CSV</button>
    <hr>
    <button class="drawer-item" data-view="home">🧮&nbsp;&nbsp;Calculator</button>
    <button class="drawer-item" data-view="recurring">🔁&nbsp;&nbsp;Recurring</button>
    <button class="drawer-item" data-view="transactions">🧾&nbsp;&nbsp;Transactions</button>
    <hr>
    <button class="drawer-item" data-action="reset">🗑️&nbsp;&nbsp;Reset all data</button>
    <p class="drawer-foot muted small">Your data never leaves this phone. Imports are read on-device and stored in this app's private storage.</p>
  </nav>

  <main>
    <section id="view-home" class="view active" aria-label="Calculator">
      <button id="dataPill" class="pill">No data yet · tap to import a bank CSV 📥</button>

      <label class="eyebrow" for="balance">AVAILABLE BALANCE</label>
      <div class="balance-row">
        <button id="signBtn" class="sign" aria-label="Toggle negative balance" title="Overdrawn? Tap to make it negative">$</button>
        <input id="balance" class="balance" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="0.00" aria-describedby="inputError">
        <span id="sizer" class="balance sizer" aria-hidden="true"></span>
      </div>
      <div class="underline" aria-hidden="true"></div>
      <p id="inputError" class="error" hidden></p>

      <button id="goBtn" class="go" data-phase="idle"><span class="go-label">GO</span></button>

      <section id="result" class="result" hidden aria-live="polite"></section>
    </section>

    <section id="view-recurring" class="view" aria-label="Recurring">
      <div class="chips">
        <button class="chip active" data-flow="EXPENSE">💳 Bills <span data-count="EXPENSE">0</span></button>
        <button class="chip" data-flow="INCOME">💵 Income <span data-count="INCOME">0</span></button>
        <span class="spacer"></span>
        <button id="rerunBtn" class="link">Re-run ↻</button>
      </div>
      <div id="recurringList" class="list"></div>
    </section>

    <section id="view-transactions" class="view" aria-label="Transactions">
      <div id="txSummary" class="muted label"></div>
      <div id="txList" class="list tx"></div>
    </section>
  </main>

  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <div id="busy" class="busy" hidden><div class="spinner"></div><p id="busyText"></p></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="resetDialog" class="dialog">
    <form method="dialog">
      <h2>Reset everything?</h2>
      <p>Deletes every imported transaction and all recurring analysis from this phone.</p>
      <div class="dialog-actions">
        <button value="keep" class="link">Keep</button>
        <button value="delete" class="link danger">Delete</button>
      </div>
    </form>
  </dialog>

  <input id="fileInput" type="file" accept=".csv,text/csv,text/comma-separated-values,application/vnd.ms-excel" hidden>
  <!-- iOS 18+ plays a haptic tick when a native switch toggles; we flip this hidden one for buzzes. -->
  <label id="hapticLabel" class="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
</body>
</html>
